name: Chocolatey Builds

on:
  # Trigger on pushes and on pull requests
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build using mono on Ubuntu
  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Cache Tools
      uses: actions/cache@v4
      with:
        path: tools
        key: ${{ runner.os }}-tools-${{ hashFiles('recipe.cake') }}
    - name: Install Mono
      run: |
        # Ubuntu's own archive, as Mono's apt repo stops at Ubuntu 20.04 and its packages can't install on 26.04.
        sudo apt update
        sudo apt install -y mono-devel
        # Ubuntu's Mono has no ca-certificates-mono or cert-sync, so point Mono's TLS trust store at the system's hashed CA directory.
        sudo mkdir -p /usr/share/.mono/new-certs
        sudo ln -sfn /etc/ssl/certs /usr/share/.mono/new-certs/Trust
        mono --version
    - name: Install dotnet #needed for GitVersion
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5
      with:
        dotnet-version: |
          5.0.x
    # .NET SDK 11 no longer runs .NET Framework tests under Mono, so stay on the newest installed 10.0 SDK.
    - name: Select .NET 10 SDK
      run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature" } }' > global.json
    - name: Report installed dotnet versions
      run: |
          dotnet --info
    - name: Build with Mono
      run: |
        chmod +x build.sh
        $GITHUB_WORKSPACE//build.sh --verbosity=diagnostic --target=CI --testExecutionType=unit
    - name: Upload Ubuntu build results
      uses: actions/upload-artifact@v4
      # Always upload build results
      if: ${{ always() }}
      with:
        name: ubuntu-build-results
        path: |
          code_drop/TestResults/issues-report.html
          code_drop/TestResults/NUnit/TestResult.xml
          code_drop/Packages/NuGet/*.nupkg
          code_drop/MsBuild.log
  # Build on Windows
  windows-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Cache Tools
      uses: actions/cache@v4
      with:
        path: tools
        key: ${{ runner.os }}-tools-${{ hashFiles('recipe.cake') }}
    - name: Install dotnet #needed for GitVersion
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5
      with:
        dotnet-version: |
          5.0.x
    - name: Report installed dotnet versions
      run: |
          dotnet --info
    - name: Build with .Net Framework
      shell: powershell
      run: ./build.ps1 --verbosity=diagnostic --target=CI --testExecutionType=unit --shouldRunOpenCover=false --shouldBuildMsi=true
    - name: Upload Windows build results
      uses: actions/upload-artifact@v4
      # Always upload build results
      if: ${{ always() }}
      with:
        name: windows-build-results
        path: |
          code_drop\TestResults\issues-report.html
          code_drop\TestResults\NUnit\TestResult.xml
          code_drop\TestCoverage\lcov.info
          code_drop\TestCoverage\OpenCover.xml
          code_drop\ilmerge-chocoexe.log
          code_drop\ilmerge-chocolateydll.log
          code_drop\Packages\NuGet\*.nupkg
          code_drop\Packages\Chocolatey\*.nupkg
          code_drop\MsBuild.log
          code_drop\MSIs\en-US\chocolatey-*.msi
  # Build using mono on MacOS
  macos-build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Cache Tools
      uses: actions/cache@v4
      with:
        path: tools
        # tools contains architecture-specific binaries, so Arm64 and x64 runners can't share a cache.
        key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('recipe.cake') }}
    # Official universal package, which runs Mono as x64 under Rosetta, rather than Homebrew's Arm-native
    # Mono: the libgit2 bundled in Cake.Git 1.1.0 has no Arm64 macOS build.
    - name: Install Mono
      run: |
        curl -fsSL -o "$RUNNER_TEMP/mono.pkg" https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg
        sudo installer -pkg "$RUNNER_TEMP/mono.pkg" -target /
        echo "/Library/Frameworks/Mono.framework/Versions/Current/Commands" >> "$GITHUB_PATH"
        /Library/Frameworks/Mono.framework/Versions/Current/Commands/mono --version
    - name: Install dotnet #needed for GitVersion
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5
      with:
        dotnet-version: |
          5.0.x
    # .NET SDK 11 no longer runs .NET Framework tests under Mono, so stay on the newest installed 10.0 SDK.
    - name: Select .NET 10 SDK
      run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature" } }' > global.json
    - name: Report installed dotnet versions
      run: |
          dotnet --info
    - name: Build with Mono
      run: |
        export DOTNET_ROOT=$HOME/.dotnet
        chmod +x build.sh
        $GITHUB_WORKSPACE//build.sh --verbosity=diagnostic --target=CI --testExecutionType=unit
    - name: Upload MacOS build results
      uses: actions/upload-artifact@v4
      # Always upload build results
      if: ${{ always() }}
      with:
        name: macos-build-results
        path: |
          code_drop/TestResults/issues-report.html
          code_drop/TestResults/NUnit/TestResult.xml
          code_drop/Packages/NuGet/*.nupkg
          code_drop/MsBuild.log
  # Build using Mono in Docker on Ubuntu
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: docker/Dockerfile.linux
          push: false
          tags: chocolatey/choco:latest
